<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    box-sizing: border-box;
  }
  #game {
    display: block;
    width: min(1280px, 96vw);
    height: auto;
    background: #101623;
    border: 1px solid #2a3348;
    border-radius: 8px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    outline: none;
  }
  .hint {
    font-size: 14px;
    color: #9aa7bd;
    text-align: center;
    max-width: 1280px;
  }
  .hint b { color: #e8e8e8; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" tabindex="0"></canvas>
<p class="hint">Solmar City. Press Enter or click New Game to play. WASD drive &amp; walk, E interact, Space punch / handbrake, Q radio, M mute.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
