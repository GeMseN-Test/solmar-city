<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #0b0e14; color: #e8ecf1; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { font-size: 20px; margin: 14px 0 4px; letter-spacing: 1px; }
  p.sub { margin: 0 0 10px; color: #9aa7b8; font-size: 13px; }
  #wrap { position: relative; }
  canvas { display: block; background: #10151f; border: 1px solid #263142; max-width: 96vw; height: auto; }
  #status { margin: 10px 0 4px; font-size: 13px; color: #9aa7b8; min-height: 18px; text-align: center; }
  #help { font-size: 12px; color: #6b7a8d; text-align: center; max-width: 760px; line-height: 1.6; padding: 0 12px 20px; }
  kbd { background: #1c2634; border: 1px solid #33445a; border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<h1>SOLMAR CITY</h1>
<p class="sub">An open-world crime game — 12 missions, SCPD heat, boats, radio, taxis &amp; coins.</p>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<div id="status">Solmar City. Press Enter or click New Game to play.</div>
<div id="help">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &amp; drive &nbsp;·&nbsp; <kbd>E</kbd> steal car / board boat &nbsp;·&nbsp; mouse aim, click shoot &nbsp;·&nbsp; <kbd>Space</kbd> punch / handbrake &nbsp;·&nbsp; <kbd>Q</kbd> radio &nbsp;·&nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>Shift</kbd> run
</div>
<noscript><p>Solmar City needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
