<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffd23e'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%231a1a1a'%3ES%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a12;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    margin: 14px 0 8px;
    font-size: 22px;
    letter-spacing: 2px;
    color: #ffd23e;
  }
  #game {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 96vw;
    background: #1a2a1a;
    border: 2px solid #333;
    border-radius: 8px;
    outline: none;
  }
  #status {
    margin-top: 8px;
    font-size: 13px;
    color: #9fd8ff;
    min-height: 18px;
  }
  .fallback {
    margin-top: 6px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<h1>SOLMAR CITY</h1>
<canvas id="game" width="1280" height="800" tabindex="0"></canvas>
<div id="status">Solmar City. Press Enter or click New Game to play.</div>
<p class="fallback">Solmar City. Press Enter or click New Game to play.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
