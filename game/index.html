<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0e1a24;
    color: #e8eef4;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
    color: #ffd21a;
  }
  h1 span { color: #7fd4ff; }
  #wrap {
    position: relative;
    max-width: 1280px;
    width: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #12324a;
    border: 2px solid #2b3f52;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  p.fallback {
    margin: 0;
    font-size: 14px;
    color: #9fb4c4;
    text-align: center;
  }
  p.keys {
    margin: 0;
    font-size: 13px;
    color: #7d93a5;
    text-align: center;
  }
</style>
</head>
<body>
<h1>SOLMAR <span>CITY</span></h1>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<p class="fallback">Solmar City. Press Enter or click New Game to play.</p>
<p class="keys">WASD move &middot; E enter car / boat &middot; Q radio &middot; Space handbrake / punch &middot; M mute &middot; P pause</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
