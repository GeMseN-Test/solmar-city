<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a2e'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23ffd21f'%3ES%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d17;
    color: #f2f2f2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    box-sizing: border-box;
  }
  #wrap {
    width: min(1280px, 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #101018;
    border: 1px solid #2c2c44;
    border-radius: 8px;
    image-rendering: auto;
  }
  #status {
    min-height: 1.4em;
    font-size: 14px;
    color: #b8b8cc;
    text-align: center;
  }
  #help {
    font-size: 13px;
    color: #8a8aa3;
    text-align: center;
    line-height: 1.6;
    max-width: 900px;
  }
  #help b { color: #d8d8ea; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="status">Solmar City. Press Enter or click New Game to play.</div>
  <div id="help">
    <b>WASD / arrows</b> move &nbsp;·&nbsp; <b>E</b> steal car / board boat &nbsp;·&nbsp;
    <b>Mouse</b> aim &amp; shoot &nbsp;·&nbsp; <b>Space</b> punch / handbrake &nbsp;·&nbsp;
    <b>Shift</b> run &nbsp;·&nbsp; <b>Q</b> radio &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp;
    <b>P</b> pause
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
