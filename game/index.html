<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    display: block;
    background: #10141d;
    border: 1px solid #26303f;
    max-width: 96vw;
    max-height: 86vh;
  }
  p { margin: 0; font-size: 14px; opacity: 0.85; text-align: center; }
  .hint { font-size: 12px; opacity: 0.55; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p>Solmar City. Press Enter or click New Game to play.</p>
<p class="hint">WASD drive &amp; walk &middot; E steal / interact / board a boat &middot; Space punch &amp; handbrake &middot; Q radio &middot; M mute</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
