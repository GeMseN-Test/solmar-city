<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1020'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23ffd34d'%3ES%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; color: #e8ecf4;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; }
  #wrap { position: relative; }
  canvas { display: block; background: #101828; border: 1px solid #2a3550;
    border-radius: 8px; max-width: 96vw; max-height: 88vh; }
  #status { font-size: 13px; color: #9aa7bd; text-align: center;
    min-height: 18px; }
  .hint { font-size: 12px; color: #6b7a94; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<div id="status">Solmar City. Press Enter or click New Game to play.</div>
<div class="hint">WASD move &middot; E steal car / board boat &middot; Mouse aim &amp; shoot &middot; Space punch / handbrake &middot; Q radio &middot; M mute &middot; P pause</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
